<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Zoom Effect</title>

    <style>
        .images {
            display: grid;
            grid-template-columns: repeat(3, 200px);
            gap: 20px;
            justify-content: space-evenly;
        }

        .movie {
            width: 300px;
            height: 400px;
            border: 3px solid red;
            border-radius: 10px;
        }

        .movie img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .movie img:hover {
            transition: 0.5s;
            transform: scale(1.06);
        }

    </style>
</head>

<body>
    <div class="images">
        <div class="movie">
            <img src="../Day5/assets/images/index-images/avengers.jpg" alt="">
        </div>

        <div class="movie">
            <img src="../Day5/assets/images/index-images/batman.jpg" alt="">
        </div>

        <div class="movie">
            <img src="../Day5/assets/images/index-images/interstellar.jpg" alt="">
        </div>

        <div class="movie">
            <img src="../Day5/assets/images/index-images/john-wick.jpg" alt="">
        </div>

        <div class="movie">
            <img src="../Day5/assets/images/movies-webseries-images/avatar.jpg" alt="">
        </div>

        <div class="movie">
            <img src="../Day5/assets/images/movies-webseries-images/leo.jpg" alt="">
        </div>
    </div>
</body>

</html>
