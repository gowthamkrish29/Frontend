<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Operator</title>
</head>
<body>
    <script>
       let bodyWeight=75;
       bodyWeight +=8;

       console.log(bodyWeight);

       bodyWeight -=8;
       console.log(bodyWeight);

       bodyWeight *=2.5;
       console.log(bodyWeight);

       bodyWeight /=1.5;
       console.log(bodyWeight);

       bodyWeight %=50;
       console.log(bodyWeight);
    </script>
</body>
</html>
