<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Logo Rotation</title>

    <style>
        .company {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            justify-content: space-around;
        }

        .logo {
            width: 470px;
            height: 350px;
            border: 3px solid red;
            border-radius: 10px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .logo img:hover {
            transition: 1.5s;
            transform: rotate(360deg);
        }

    </style>
</head>

<body>
    <div class="company">
        <div class="logo">
            <img src="asstes/images/google-logo.webp" alt="">
        </div>

        <div class="logo">
            <img src="asstes/images/microsoft" alt="">
        </div>

        <div class="logo">
            <img src="asstes/images/Apple-Logo.png" alt="">
        </div>

        <div class="logo">
            <img src="asstes/images/Amazon-logo-meaning.jpg" alt="">
        </div>

        <div class="logo">
            <img src="asstes/images/tesla-logo-png_seeklogo-329764.png" alt="">
        </div>

    </div>
</body>

</html>
