<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Card Layout</title>
    <link rel="stylesheet" href="Asstes/css/product.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>Products Card Layout</h1>
        </div>
    </header>
    <main>
        <section id="products">
            <div class="airpods">
                <img src="Asstes/images/airpods.jpg" alt="Airpods">
                <p>Apple Airpods</p>
            </div>
            <div class="go-pro">
                <img src="Asstes/images/gopro.jpg" alt="Go pro">
                <p>Go-Pro</p>
            </div>
            <div class="Iphone">
                <img src="Asstes/images/iphone.jpg" alt="Iphone">
                <p>Iphone 17 Pro Max</p>
            </div>
            <div class="mac">
                <img src="Asstes/images/mac.jpg" alt="Mac">
                <p>MAC Book Pro</p>
            </div>
            <div class="samsung-phone">
                <img src="Asstes/images/sam-phone.jpg" alt="sam-phone">
                <p>Samsung S24 Ultra</p>
            </div>
            <div class="samsung-watch">
                <img src="Asstes/images/samsung.jpg" alt="Samsung-watch">
                <p>Samsung Watch</p>
            </div>
        </section>
    </main>
</body>
</html>
