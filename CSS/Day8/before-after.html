<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before & After</title>

    <style>
        h1::before {
            content: "★ ";
            color: coral;
        }

        h1::after {
            content: " ✔";
            color: fuchsia;
        }

    </style>

</head>
<body>
    <div>
        <h1>HTML</h1>
        <h1>CSS</h1>
        <h1>JavaScript</h1>
        <h1>React</h1>
        <h1>Node.js</h1>
    </div>
</body>
</html>
