<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>

    <style>
        li:first-child {
            color: red;
        }

        li:last-child {
            color: darkorange;
        }

        li:nth-child(5) {
            color: darkmagenta;
        }

        li {
            font-size: xx-large;
            font-weight: bolder;
        }
    </style>

</head>

<body>
    <div>
        <ul>
            <li>Gowtham</li>
            <li>Vijay</li>
            <li>Karthik</li>
            <li>Rahul</li>
            <li>Kishore</li>
            <li>Akash</li>
            <li>Bharath</li>
            <li>Hari</li>
            <li>Dinesh</li>
        </ul>
    </div>
</body>

</html>
