<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>
<h2>Contact Us</h2>
<form>
<label for="username">Name:</label><br>
<input type="text" id="username"><br><br>
<label for="useremail">Email:</label><br>
<input type="email" id="useremail"><br><br>
<label for="usernumber">Phone Number:</label><br>
<input type="tel" id="usernumber" minlength="10" maxlength="10"><br><br>
<label for="useraddress">Address:</label><br>
<input type="text" id="useraddress"><br><br>
<label>Message:</label><br>
<textarea rows="5" cols="30" placeholder="Enter something" required></textarea>
<br><br>
<button type="submit">Send Message</button>
<button type="reset">Reset</button>
</form>
</body>
</html>
