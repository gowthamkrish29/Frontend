<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        let marks=90;

        if (marks>=90) {
            console.log("A+ Grade");
        } else if (marks >=75 && marks<=89){
            console.log("A Grade") ;
        }  else if (marks >=50 && marks<=74){
            console.log("B Grade") ;
        }   else if (marks >=35 && marks<=49){
            console.log("C Grade") ;
        } else {
            console.log("Fail")
        }
    </script>
</body>
