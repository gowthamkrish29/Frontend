<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    
    <h1 style="background-color: cadetblue; color: black; padding: 10px; ">Login Page</h1>

    <form id="loginForm">

        <label>Email:</label>
        <input type="email" name="" id="email" placeholder="Enter Your Email">
        <br><br>


        <label>Password:</label>
        <input type="password" name="" id="password" placeholder="Enter Your Password">
        <br><br>

        <button type="submit" style="background-color: indigo; color: wheat; padding: 10px; font-size: x-large; font-weight: bolder; border: none; border-radius: 6px; cursor: pointer;">Login</button>

         <p id="error"></p>
    </form>

    <br><br>
    <a href="register.html" style="text-decoration: none;">Not Yet Registered? - Sign up here</a>

    <script src="assets/js/login.js"></script>

</body>
</html>
