<html>

<head>
    <title>Interactive Tag</title>
</head>

<body>
    <center>
        <h1>Interactive Tag</h1>
    </center>

    <h1>1. Anchor Tag</h1>
    <a href="https://wikipedia.org" target="_blank">Visit Wikipedia</a>

    <h1>2. Button Tag</h1>
    <button type="button">Save Settings</button>

    <h1>3. Input Tag</h1>
    <input type="email" placeholder="name@example.com">

    <h1>4. Selection Tag & Option Tag</h1>
    <select select course>
        <option>Python</option>
        <option>Java</option>
        <option>C++</option>

    </select>

    <h1>5. Textarea</h1>
    <textarea placeholder="Type here..."></textarea>

    <h1>6. Details & Summary</h1>
    <details>
  <summary>Is shipping free?</summary>
  <p>Yes, shipping is free on all orders over ₹500.</p>
</details>

<h1>7. Form Tag</h1>
<form>
  <input type="text" placeholder="Username" required>
  <button type="submit">Log In</button>
</form>

</body>

</html>
