<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical Operator</title>
</head>
<body>
    <script>

        const age=20;
        const isActive= true;

        console.log(age >=18 && isActive);
        console.log(age <=18 || isActive);
        console.log(!isActive);

    </script>
</body>
</html>
