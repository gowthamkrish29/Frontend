<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For - loop</title>
</head>

<body>
    <script>
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        for (let i = 10; i >= 1; i--) {
            console.log(i);
        }

        for (let i = 1; i <= 20; i++) {
            console.log(i);
        }

        for (let i = 1; i <= 20; i++) {
            if (i % 2 === 0) {
                console.log(i);

            }
        }

        for (let i = 1; i <= 20; i++) {
            if (i % 2 !== 0) {
                console.log(i);

            }
        }

        for (let i = 1; i <= 50; i++) {
            if (i % 5 === 0) {
                console.log(i);

            }
        }

        for (let i = 10; i >= 5; i--) {
            console.log(i);

        }

        for (let i = 1; i <= 10; i++) {
            console.log("5 x " + i + "=" + (5 * i));
        }

        let sum = 0;

        for (let i = 1; i <= 10; i++) {
            sum = sum + i;
        }
        console.log(sum);
    </script>
</body>

</html>
