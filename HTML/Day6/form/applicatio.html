<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
</head>

<body>
    <center>
        <section>
        <div>
            <h1>Job Application Form</h1>
        </div>
    </section>
    </center>
    <form>
        <section>
            <div>
                <h3>Personal Information</h3>
                <label for="username">Full Name:</label><br>
                <input type="text" id="username" placeholder="Enter your Name"><br><br>
                <label for="useremail">Email</label><br>
                <input type="email" id="useremail" placeholder="Enter your Email"><br><br>
                <label for="usernumber">Phone Number</label><br>
                <input type="tel" id="usernumber" minlength="10" maxlength="10" placeholder="10 Digit Number"> <br><br>
                <label for="useraddress">Address</label><br>
                <input type="text" id="useraddress" placeholder="Enter Your Adress"><br><br>
            </div>
        </section>
        <section>
            <div>
                <h3>Education</h3>
            </div>
            <section>
                <label for="userschool">School/Institute</label><br>
                <input type="text" id="userschool" placeholder="Enter College Name"><br><br>
                <label for="degree">Degree</label><br>
                <input type="text" id="degree" placeholder="Enter Degree"><br><br>
                <label for="year">Year Completed</label><br>
                <input type="number" id="year"><br><br>
            </section>
            <section>
                <div>
                    <h3>Skill & Qualification</h3>
                </div>
            </section>
            <section>
                <label for="skills">List relevant Skills, Certifications & Qualifications</label><br>
                <textarea rows="5" cols="20" id="skills" placeholder="Enter Skills & Qualifications"></textarea><br><br>
                <label for="resume">Resume</label><br>
                <input type="file" id="resume" placeholder="Upload Your Resume">
            </section>
        </section>
    </form>
</body>

</html>
