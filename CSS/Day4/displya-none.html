<!DOCTYPE html>
<html>

<head>
    <title>Display None & Visibility Hidden<</title>
    <style>

        .main {
            background-color: teal;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 600px;
            border: solid black 5px;
            margin: auto;
        }
        .box {
            width: 150px;
            height: 80px;
            background-color: mediumseagreen;
            color: white;
            text-align: center;
            line-height: 80px;
            margin: 10px;
            display: flex;
            justify-content: center;
        }

        .hide {
            display: none;
        }

        .main-1{
            background-color: teal;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 600px;
            border: solid black 5px;
            margin: auto;
            margin-top: 30px;
        }
        .box-1{
            width: 150px;
            height: 80px;
            background-color: mediumseagreen;
            color: white;
            text-align: center;
            line-height: 80px;
            margin: 10px;
            display: flex;
            justify-content: center;
        }

        .hide {
            visibility: hidden;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1 style="font-family: fantasy; color: coral;">Display : None</h1>
        <div class="box">Box 1</div>
        <div class="box hide">Box 2</div>
        <div class="box">Box 3</div>
    </div>

    <div class="main-1">
        <h1 style="font-family: cursive; color: gold;" : None> Visibility : None</h1>
        <div class="box-1">Box 1</div>
        <div class="box-1 hide">Box 2</div>
        <div class="box-1">Box 3</div>
    </div>
</body>

</html>
