<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
<h2>Feedback Form</h2>
<form>
<label for="username">Name:</label><br>
<input type="text" id="username"><br><br>
<label for="useremail">Email:</label><br>
<input type="email" id="useremail"><br><br>
<label>Rate Our Service:</label><br>
<input type="radio" name="rating"> Excellent
<input type="radio" name="rating"> Good
<input type="radio" name="rating"> Average
<input type="radio" name="rating"> Poor
<br><br>
<label>Your Feedback:</label><br>
<textarea rows="5" cols="35"></textarea>
<br><br>
<button type="submit">Submit Feedback</button>
<button type="reset">Clear</button>
</form>
</body>
</html>
