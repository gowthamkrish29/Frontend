<script>
    let n=5;
    let factorial = 1;
    let i=1;

    while(i<=n){
        factorial = factorial * i;
        i++
    }

    console.log(factorial);
    
</script>


<script>
    let fact = (n)=>{
        let result = 1;

        for(i=1; i<=n; i++){
            result = result * i;
        }

        return result;
    }

    console.log(fact(5));
    
</script>
