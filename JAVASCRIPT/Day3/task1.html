<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operator</title>
</head>
<body>
    <script>
        let a=50;
        let b=30;

        console.log(a+b);
        console.log(a-b);
        console.log(a*b);
        console.log(a%b);
        console.log(a/b);

    </script>
</body>
</html>
