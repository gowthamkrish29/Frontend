<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container my-5 py-4 g-2">
        <div class="row g-3">
            <div class="col-3 text-white bg-dark p-4">
                <h2 class="text-danger">Box-1</h2>
            </div>
            <div class="col-3 text-white bg-success p-4">
                <h2 class="text-white">Box-2</h2>
            </div>
            <div class="col-3 text-info bg-warning p-4">
                <h2 class="text-white">Box-3</h2>
            </div>
            <div class="col-3 bg-secondary p-4">
                <h2 class="text-white">Box-4</h2>
            </div>
        </div>
    </div>
</body>
</html>
