<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Hover Effect</title>

    <style>
        .buttons button {
            background-color: darkolivegreen;
            color: darkkhaki;
            width: 100px;
            height: 50px;
            border: none;
            border-radius: 10px;
            padding: 30px;
            margin: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bolder;
            font-size: 18px;
        }

        .buttons button:hover {
            background-color: rebeccapurple;
            color: sandybrown;
        }
    </style>

</head>
<body>
        <div class="buttons">
            <button>Save</button>
            <button>Edit</button>
            <button>Delete</button>
            <button>Login</button>
            <button>Register</button>

        </div>
</body>
</html>
