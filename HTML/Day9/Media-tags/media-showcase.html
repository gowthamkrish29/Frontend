<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Showcase Webpage</title>
</head>

<body>
    <center>
        <header>
            <div>
                <h1>Media Showcase Webpage</h1>
            </div><br>
            <nav>
                <a href="#">Home</a> |
                <a href="#image">Images</a> |
                <a href="#audio">Audio Player</a> |
                <a href="#video">Video Player</a> |
                <a href="#youtube">YouTube Video</a> |
                <a href="#map">Google Map</a> |
                <a href="#pdf">Embedded PDF</a>
            </nav><br>
        </header>
        <hr>
    <main>
        <div id="image">
            <h2>Images</h2>
        </div>
            <div>
                <img src="../Media-tags/images/msd.jpg" alt="MSD Images" width="500" height="300">
            </div><br>
            <div>
                <img src="../Media-tags/images/bike.avif" alt="Manali Images" width="500" height="300">
            </div><br>
            <div>
                <img src="../Media-tags/images/bcs.jpg" alt="Manali Images" width="500" height="300">
            </div><br>
    </main><br><br>
    <hr>
    </center>
    <section>
        <div id="audio">
            <h2>Audio</h2>
            <audio controls loop muted >
                <source src="../Media-tags/audios/2audio.mpeg" type="audio/mpeg">
            </audio>
        </div>
    </section><br><br>
    <hr>
    <section>
        <div id="video">
            <h2>Video</h2>
            <video controls muted loop widt="700" height="300" poster="../Media-tags/images/bcs.jpg">
                <source src="../Media-tags/videos/bcs.mp4" type="video/mp4">
            </video>
        </div>
    </section><br><br>
    <hr>
    <section>
        <div id="youtube">
            <h2>YouTube</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/c42h1rz-q-s?si=lmTfY2cEj8v5rylZ"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
            </iframe>
        </div>
    </section><br><br>
    <hr>
    <section>
        <div id="map">
            <h2>Google Map</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4638066.227793601!2d78.33983479928152!3d10.783402048753725!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba4e2d26515b679%3A0x4ad0261ce59e827e!2sCoorg!5e0!3m2!1sen!2sin!4v1784818353025!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section><br><br>
        </div>
    <hr>
    <section>
        <div id="pdf">
            <h2>Embedded PDF</h2>
            <iframe src="../Media-tags/pdfs/gowtham_fsd_res.pdf" frameborder="3" width="600" height="300"></iframe>
        </div>
    </section><br><br>
    <hr>
    <center>
        <footer>
        <p><strong> &copy; Created By Gowtham Krishnan R</strong></p>
    </footer>
    <a href="#">Move To Top</a>
    </center>
</body>
</html>
