<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCREMENT & DECREMENT Operator</title>
</head>
<body>
    <script>

        let age=20;
        console.log(age);

        age++;  
        console.log(age);

        age++;
        console.log(age);

        var marks=70;
        console.log(marks);

        marks--;  
        console.log(marks);

        marks--;
        console.log(marks);

        let weight=75.7;

        console.log(++weight);
        console.log(weight);

        let weight1=75.7;

        console.log(weight1++);
        console.log(weight1);

    </script>
</body>
</html>
