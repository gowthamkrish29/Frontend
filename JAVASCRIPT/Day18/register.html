<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
</head>
<body>

    <h1 style="background-color: darkorchid; color: antiquewhite; padding: 5px;">Register Page</h1>


    <form id="registerForm">

        <label>Name: </label>
        <input type="text" name="" id="name" placeholder="Enter Your Name">
        <br><br>


        <label>Email:</label>
        <input type="email" name="" id="email" placeholder="Enter Your Email ">
        <br><br>


        <label>Password:</label>
        <input type="password" name="" id="password" placeholder="Enter Your Password">
        <br><br>


        <button type="submit" style="background-color: darkblue; color: white; padding: 10px; border:none; border-radius: 6px; cursor: pointer; font-size: large; font-weight: bolder;">Register</button>

        <p id="message"></p>

    </form>
    <br><br>
    <a href="login.html" style="text-decoration: none;">Already Registered? - Go to Login Page</a>

    <script src="assets/js/register.js"></script>

</body>
</html>
